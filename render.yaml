# Render Blueprint: New > Blueprint > pick this repo. Creates the web service and a Postgres database.
services:
  - type: web
    name: agents-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agents-dashboard-db
          property: connectionString
      - key: APP_SECRET            # encrypts stored Jira tokens; keep it stable
        generateValue: true
      - key: DASHBOARD_PASSWORD    # asked for when you open the dashboard; you type it in during setup
        sync: false
      # PUBLIC_BASE_URL is optional: Render's own URL (RENDER_EXTERNAL_URL) is used when it is not set.

databases:
  - name: agents-dashboard-db
    plan: free
